name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Arabic text is shaped by Core Text: the tests run on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
