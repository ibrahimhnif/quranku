name: Android smoke test

# Installs an APK on an emulator, opens it, and keeps what it logged and
# showed: the latest release's by default, or one this run builds.
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build the APK from this commit instead of the latest release's
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-go@v5
        if: inputs.build
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        if: inputs.build
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK
        if: inputs.build
        run: |
          export ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}
          go tool mygo build -platform android/amd64
          find build/android -name '*.apk' -exec cp {} app.apk \;
      - name: Download the latest release's APK
        if: ${{ !inputs.build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern Quranku-Android.apk --output app.apk
      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p smoke
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p io.github.ibrahimhnif.quranku -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > smoke/screen.png
            adb shell dumpsys activity activities | grep -i -E "mResumedActivity|topResumedActivity|quranku" | head -20 > smoke/activity.txt || true
            adb shell pidof io.github.ibrahimhnif.quranku > smoke/pid.txt || echo "not running" > smoke/pid.txt
            adb logcat -d > smoke/logcat.txt
            adb logcat -d -b crash > smoke/crash.txt || true
            grep -E "quranku|mygo|AndroidRuntime|FATAL|libc|DEBUG|GoLog|panic" smoke/logcat.txt | tail -200 > smoke/relevant.txt || true
            echo "pid: $(cat smoke/pid.txt)"
            cat smoke/crash.txt | head -80
            tail -80 smoke/relevant.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
