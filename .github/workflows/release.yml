name: Release

# A tag such as v0.2.0 builds the apps and publishes them as a GitHub
# release; running the workflow by hand builds them as artifacts of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Windows, os: ubuntu-latest, platform: windows/amd64 }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Pack AppImages
        if: matrix.name == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          export PATH="$RUNNER_TEMP:$PATH" APPIMAGE_EXTRACT_AND_RUN=1
          scripts/appimage.sh build/linux-amd64 x86_64
          scripts/appimage.sh build/linux-arm64 aarch64
      - name: Collect
        run: |
          mkdir dist
          version=$(jq -r .version mygo.json)
          case "${{ matrix.name }}" in
            macOS) cp build/*/*.dmg dist/ ;;
            Windows)
              cp build/windows-amd64/*-setup-*.exe dist/
              cp build/windows-amd64/Quranku.exe "dist/Quranku-$version-windows-amd64-portable.exe" ;;
            Linux) cp build/*/*.AppImage build/*/*.deb build/*/*.tar.gz dist/ ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Quranku $GITHUB_REF_NAME" --generate-notes
